<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! | Durgesh Sakhardande</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
      body {
        background-color: #111827;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      .animate-bounce {
        animation: bounce 1s infinite;
      }
      @keyframes bounce {
        0%, 100% {
          transform: translateY(-5%);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center">
    <div class="text-center max-w-lg mx-auto px-4">
      <div class="text-6xl mb-6 animate-bounce">✅</div>
      <h1 class="text-4xl font-bold mb-4 text-purple-400">Message Sent!</h1>
      <p class="text-xl text-gray-300 mb-8">Thank you for reaching out. I'll get back to you as soon as possible.</p>
      <a href="index.html" class="inline-block bg-purple-600 hover:bg-purple-700 text-white font-medium rounded px-6 py-3 transition duration-300">
        Return to Portfolio
      </a>
    </div>
  </body>
</html>
